aid: apollo-agriculture
name: Apollo Agriculture
description: 'Apollo Agriculture is an agricultural technology company founded in 2016 and
  headquartered in Nairobi, Kenya, that helps small-scale farmers across Africa maximize their
  profits. Apollo delivers a full-stack service bundling quality farm inputs (seed and fertilizer),
  flexible input financing and credit, satellite- and machine-learning-driven agronomic advice,
  crop insurance, and market access, distributed through a network of local agrodealers and mobile
  technology. The company serves smallholder farmers in markets including Kenya and Zambia and is
  backed by investors including Anthemis and the SoftBank Vision Fund. This profile tracks Apollo
  Agriculture as a company in the API Evangelist network; no public developer API has been identified
  at this time.'
